[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clikernel"
dynamic = ["version"]
description = "Serve persistent Jupyter kernels to LLMs as concise text, over MCP or a plain stream protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "clikernel contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "fastcore>=2.1.17",
  "jupyasyncclient>=0.2.1",
  "mcpmini>=0.0.1",
  "aidialog>=0.0.7",
  "pillow",
]

[project.optional-dependencies]
dev = [
  "fastship",
  "jupygate>=0.0.1",
]


[project.entry-points.pyskills]
clikernel = "clikernel.skill"

[project.urls]
Repository = "https://github.com/AnswerDotAI/clikernel"
Documentation = "https://AnswerDotAI.github.io/clikernel/"

[project.scripts]
clikernel = "clikernel.cli:main"
clikernel-mcp = "clikernel.mcp:main"

[project.entry-points.nbdev]
clikernel = "clikernel._modidx:d"

[tool.nbdev]

[tool.setuptools.dynamic]
version = { attr = "clikernel.__version__" }

[tool.setuptools.packages.find]
include = ["clikernel"]
